spring.application.name=bibliotheque

# --- MySQL (la base est créée automatiquement si elle n'existe pas) ---
spring.datasource.url=jdbc:mysql://localhost:3306/bibliotheque?createDatabaseIfNotExist=true
spring.datasource.username=biblio
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
